plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexora.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nexora.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        manifestPlaceholders = [allowCleartext: (System.getenv('ALLOW_CLEARTEXT') == 'true' ? 'true' : 'false')]
    }

    signingConfigs {
        release {
            // CI writes a temporary keystore outside the repository. Never commit it.
            def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [allowCleartext: 'false']
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    // Serves bundled assets from a secure HTTPS-like origin instead of file://.
    implementation 'androidx.webkit:webkit:1.17.1'
}
