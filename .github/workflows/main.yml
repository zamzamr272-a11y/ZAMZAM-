name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Also build a signed release APK (requires Android signing secrets)'
        required: true
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Package current frontend into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -a frontend/. android/app/src/main/assets/www/

      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release-apk:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare signing key outside workspace
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexora-release.jks"
          chmod 600 "$RUNNER_TEMP/nexora-release.jks"

      - name: Package current frontend into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -a frontend/. android/app/src/main/assets/www/

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nexora-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Android-signed-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
